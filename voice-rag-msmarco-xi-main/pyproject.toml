[project]
name = "voice-rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[tool.pyright]
extraPaths = [".", "src"]

[tool.pylance]
extraPaths = [".", "src"]

[tool.vercel]
entrypoint = "backend.index:app"
